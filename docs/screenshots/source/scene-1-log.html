<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GastoBot — log expense</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span class="icons">
      <span>●●●●</span>
      <span>5G</span>
      <span>🔋</span>
    </span>
  </div>

  <div class="chat-header">
    <span class="back">‹</span>
    <div class="avatar">K</div>
    <div class="name">GastoBot <span class="verified">✓</span></div>
    <div class="call">📞</div>
  </div>

  <div class="chat-body">
    <div class="date-pill">Hoy</div>

    <div class="msg sent">almuerzo 35 soles<span class="time">12:45<span class="ticks">✓✓</span></span></div>

    <div class="msg received">✅ <strong>S/35.00</strong> — 🍽 Food &amp; Dining
"almuerzo" · 23 abr<span class="time">12:45</span></div>

    <div class="msg sent">uber al trabajo 18<span class="time">8:52<span class="ticks">✓✓</span></span></div>

    <div class="msg received">✅ <strong>S/18.00</strong> — 🚗 Transport
"uber al trabajo" · 24 abr<span class="time">8:52</span></div>

    <div class="msg sent">cafe con yape 12.50<span class="time">10:18<span class="ticks">✓✓</span></span></div>

    <div class="msg received">✅ <strong>S/12.50</strong> — ☕ Cafe/Snack
"cafe con yape" · Yape · 24 abr<span class="time">10:18</span></div>
  </div>

  <div class="input-bar">
    <div class="icon-btn">+</div>
    <div class="field">Mensaje</div>
    <div class="icon-btn">📷</div>
    <div class="icon-btn">🎤</div>
  </div>
</div>
</body>
</html>
