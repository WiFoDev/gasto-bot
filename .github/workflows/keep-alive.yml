name: keep-alive

# Supabase pauses free-tier projects after 7 days without activity, and a cold
# Railway service takes a few seconds to answer the first WhatsApp webhook.
# An hourly authenticated ping to /cron/keep-alive touches Postgres and keeps
# both warm. Railway has no built-in scheduler, so GitHub Actions is the cron.
# Scheduled runs are free — public repos don't consume Actions minutes.
#
# Required repository secrets:
#   KEEP_ALIVE_URL — deployment base URL, e.g. https://gasto-bot.up.railway.app
#   CRON_SECRET    — same value as the CRON_SECRET env var on Railway
#
# GitHub disables scheduled workflows in public repos after 60 days without a
# commit ("disabled_inactivity") — this happened on 2026-09-25 and Supabase
# paused a week later. The weekly `reset-inactivity` job disables and
# immediately re-enables this workflow through the API, which resets that
# 60-day timer without dummy commits.

on:
  schedule:
    # Hourly at :27. Off-the-hour on purpose: GitHub's scheduler is heavily
    # contended at :00 and delays those runs by up to an hour.
    - cron: '27 * * * *'
    # Weekly (Mon 09:43 UTC): reset the 60-day inactivity timer.
    - cron: '43 9 * * 1'
  workflow_dispatch:
    inputs:
      reset_inactivity:
        description: 'Also run the inactivity-timer reset'
        type: boolean
        default: false

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping Supabase via the bot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /cron/keep-alive
        env:
          KEEP_ALIVE_URL: ${{ secrets.KEEP_ALIVE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${KEEP_ALIVE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::KEEP_ALIVE_URL and CRON_SECRET repository secrets must both be set"
            exit 1
          fi

          url="${KEEP_ALIVE_URL%/}/cron/keep-alive"
          status=""
          body=""

          # Retry: a sleeping Railway container can drop the first request while
          # it cold-starts, and that is exactly the case we are pinging to fix.
          for attempt in 1 2 3; do
            response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${url}" || true)

            status=$(printf '%s' "${response}" | tail -n1)
            body=$(printf '%s' "${response}" | sed '$d')

            echo "attempt ${attempt}: HTTP ${status:-none} — ${body:-<empty>}"

            if [ "${status}" = "200" ] && printf '%s' "${body}" | grep -q '"ok":true'; then
              echo "::notice::Supabase pinged successfully"
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done

          echo "::error::keep-alive failed after 3 attempts — last response: HTTP ${status:-none} ${body:-<empty>}"
          exit 1

  reset-inactivity:
    name: Reset GitHub's 60-day inactivity timer
    if: github.event.schedule == '43 9 * * 1' || inputs.reset_inactivity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Disable + re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          workflow="keep-alive.yml"

          # Whatever happens below, never leave the workflow disabled.
          trap 'gh workflow enable "${workflow}" --repo "${REPO}" || true' EXIT

          gh workflow disable "${workflow}" --repo "${REPO}"
          gh workflow enable "${workflow}" --repo "${REPO}"

          state=$(gh api "repos/${REPO}/actions/workflows/${workflow}" --jq .state)
          echo "workflow state: ${state}"
          if [ "${state}" != "active" ]; then
            echo "::error::keep-alive workflow is '${state}' after reset"
            exit 1
          fi
          echo "::notice::Inactivity timer reset"
